apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  namespace: lincode
  name: backend-to-postgres
  namespace: lincode

spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
